<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Log In</title>
    <div style="background: #fff3cd; color: #856404; padding: 10px; text-align: center; font-size: 14px; border-bottom: 1px solid #ffeeba;">
    <strong>Academic Student Assignment:</strong> This is a non-commercial educational project for learning purposes and has no affiliation with any official company or brand.
</div>
    <!-- Educational Student Practice Project Only -->
    <link rel="stylesheet" href="login.css">
   
</head>
<body>

    <div class="wrapper">
        <!-- Left Section -->
        <div class="left-box">
            <div class="fb-brand">
                <svg viewBox="0 0 36 36" fill="#0866FF" width="48" height="48">
                    <path d="M20.181 35.87C29.094 34.791 36 27.202 36 18c0-9.941-8.059-18-18-18S0 8.059 0 18c0 8.344 5.682 15.358 13.362 17.382v-12.29H9.328V18h4.034v-3.812c0-3.981 2.37-6.18 6.002-6.18 1.739 0 3.558.31 3.558.31v3.913h-2.005c-1.973 0-2.588 1.225-2.588 2.484V18h4.412l-.705 5.092h-3.707v12.778z"/>
                </svg>
            </div>

            <!-- Custom Built HTML/CSS Collage -->
            <div class="collage-container">
                <div class="floating-badge">😍 <span>16:45</span></div>
                
                <div class="card-main">
                    <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80" alt="Friends">
                </div>
                
                <div class="card-secondary">
                    <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=400&q=80" alt="Group">
                </div>

                <div class="floating-avatar">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="User Avatar">
                </div>
            </div>

            <h1 class="hero-title">
                Explore the things <br><span class="blue-text">you love.</span>
            </h1>
        </div>

        <!-- Right Section -->
        <div class="right-box">
            <div class="form-card">
                <h2>Log in to Facebook</h2>

                <form action="#">
                    <div class="input-group">
                        <input type="text" placeholder="Email address or mobile number" required>
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>

                   
                </form>
                <form action="dashboard.html" method="GET">
                    <!-- Email aur Password inputs yahan honge -->
                
                    <!-- Sirf Button tag use karein, <a> tag ki zaroorat nahi hai -->
                    <button type="submit" class="btn-login">Log in</button>
                </form>

                <a href="#" class="link-forgot">Forgotten password?</a>

                <a href="singup.html" class="btn-create">Create new account</a>

                <div class="meta-brand">
                    <span style="font-size: 20px;">∞</span> <strong>Meta</strong>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
